[project]
name = "llmragap"
version = "0.1.0"
description = "A minimal retrieval-augmented generation example"
readme = "README.md"
authors = [
    { email = "toyou.dev@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "bcrypt>=5.0.0",
    "chromadb>=1.5.9",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain[openai]>=1.4.8",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.3.27",
    "langchain-openai>=1.7.3",
    "langchain-openrouter==0.2.9",
    "langchain-text-splitters>=0.3.9",
    "pypdf>=7.0.1",
    "python-dotenv==1.2.4",
    "sentence-transformers>=6.2.0",
    "streamlit==1.65.0",
    "supabase>=2.33.0",
    "uvicorn>=0.54.0",
    "deepeval>=4.3.4",
    "pandas>=2.3.3",
    "langchain-mcp-adapters>=0.3.2",
]

[project.scripts]
llmragap = "llmragap:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
